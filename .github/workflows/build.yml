name: Build desktop and browser apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python -m feynman_studio.web --smoke-test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: FeynmanDiagramStudio-macOS-arm64
            archive: dist/FeynmanDiagramStudio-macOS-arm64.zip
          - os: macos-15-intel
            artifact: FeynmanDiagramStudio-macOS-x64
            archive: dist/FeynmanDiagramStudio-macOS-x64.zip
          - os: windows-latest
            artifact: FeynmanDiagramStudio-Windows-x64
            archive: dist/FeynmanDiagramStudio-Windows-x64.zip
          - os: ubuntu-latest
            artifact: FeynmanDiagramStudio-Linux-x64
            archive: dist/FeynmanDiagramStudio-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -e ".[dev]"
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FeynmanDiagramStudio --collect-data feynman_studio --icon feynman_studio/assets/app-icon.png run_feynman_studio.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FeynmanDiagramStudioWeb --collect-data feynman_studio --icon feynman_studio/assets/app-icon.png run_feynman_studio_web.py
      - name: Stamp macOS app versions
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          from feynman_studio import __version__

          for name in ("FeynmanDiagramStudio", "FeynmanDiagramStudioWeb"):
              path = Path("dist") / (name + ".app") / "Contents" / "Info.plist"
              with path.open("rb") as stream:
                  info = plistlib.load(stream)
              info["CFBundleShortVersionString"] = __version__
              info["CFBundleVersion"] = __version__
              with path.open("wb") as stream:
                  plistlib.dump(info, stream)
          PY
          codesign --force --deep --sign - dist/FeynmanDiagramStudio.app
          codesign --force --deep --sign - dist/FeynmanDiagramStudioWeb.app
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FeynmanDiagramStudio --collect-data feynman_studio --icon feynman_studio/assets/app-icon.png run_feynman_studio.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FeynmanDiagramStudioWeb --collect-data feynman_studio --icon feynman_studio/assets/app-icon.png run_feynman_studio_web.py
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FeynmanDiagramStudio --collect-data feynman_studio run_feynman_studio.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FeynmanDiagramStudioWeb --collect-data feynman_studio run_feynman_studio_web.py
      - name: Check macOS app starts
        if: runner.os == 'macOS'
        run: |
          dist/FeynmanDiagramStudio.app/Contents/MacOS/FeynmanDiagramStudio --smoke-test
          dist/FeynmanDiagramStudioWeb.app/Contents/MacOS/FeynmanDiagramStudioWeb --smoke-test
      - name: Check Windows app starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/FeynmanDiagramStudio.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $webProcess = Start-Process -FilePath "$PWD/dist/FeynmanDiagramStudioWeb.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($webProcess.ExitCode -ne 0) { exit $webProcess.ExitCode }
      - name: Check Linux app starts
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/FeynmanDiagramStudio --smoke-test
          dist/FeynmanDiagramStudioWeb --smoke-test
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: cd dist && zip -qry "$(basename '${{ matrix.archive }}')" FeynmanDiagramStudio.app FeynmanDiagramStudioWeb.app
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FeynmanDiagramStudio.exe,dist/FeynmanDiagramStudioWeb.exe -DestinationPath "${{ matrix.archive }}"
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -C dist -czf FeynmanDiagramStudio-Linux-x64.tar.gz FeynmanDiagramStudio FeynmanDiagramStudioWeb && mv FeynmanDiagramStudio-Linux-x64.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FeynmanDiagramStudio-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi
